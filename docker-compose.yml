services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: cr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - .:/app
      - artifact-data:/data
    depends_on: [db, redis]
  worker:
    build: .
    command: celery -A backend.app.jobs.celery_app worker --loglevel=INFO
    env_file: .env
    volumes:
      - .:/app
      - artifact-data:/data
    depends_on: [db, redis]
volumes:
  postgis-data:
  artifact-data:
